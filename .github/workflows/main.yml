name: Build angular app

on:
  push:
    branches: [ main ]

jobs:
  Build-angular-app:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
      - name: Use Node js
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22.x
      - name: Install Dependencies
        run: npm install
      - name: Build angular app
        run: npm run build
