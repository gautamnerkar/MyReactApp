name: job concurrency

on:
 push:
  branches: [ main ]

jobs:
 build:
  runs-on: ubuntu-latest

  concurrency:
    group: deploy
    cancel-in-progress: true

  steps:
    - name: Checkout_Repository
      uses: actions/checkout@v4
    - name: Install Dependencies
      run: npm install
    - name: Build app
      run: npm run build
    - name: Deploy app
      run: echo "Deploying....."
