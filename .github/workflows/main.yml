name: Angular_Workflow

on:
  push:
    branches: [ main ]

jobs:
  Build-App:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - name: Setup Angular Node app 
        uses: actions/setup-node@v6.5.0
        with:
          node-version: 22.x
      - name: Install Dependencies
        run: npm install
      - name: build app
        run: npm run build
          
      
    
